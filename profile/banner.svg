<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="yi-nology — 把复杂运维变简单">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="glowA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowB" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowC" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E3A5F" stroke-width="1" opacity="0.32"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- ambient glows -->
  <circle cx="150" cy="70" r="150" fill="url(#glowA)" filter="url(#soft)"/>
  <circle cx="1130" cy="270" r="170" fill="url(#glowB)" filter="url(#soft)"/>
  <circle cx="1020" cy="50" r="110" fill="url(#glowC)" filter="url(#soft)"/>

  <!-- top accent -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <!-- brand mark: hex node cluster -->
  <g transform="translate(152,158)">
    <!-- connections -->
    <line x1="30" y1="-16" x2="66" y2="-40" stroke="#3B82F6" stroke-width="1.5" opacity="0.65"/>
    <line x1="30" y1="14" x2="72" y2="34" stroke="#34D399" stroke-width="1.5" opacity="0.65"/>
    <line x1="-30" y1="18" x2="-58" y2="42" stroke="#F59E0B" stroke-width="1.5" opacity="0.55"/>
    <!-- light dots on links -->
    <circle cx="48" cy="-28" r="2.5" fill="#93C5FD" opacity="0.9"/>
    <circle cx="51" cy="24" r="2.5" fill="#6EE7B7" opacity="0.9"/>
    <circle cx="-44" cy="30" r="2.2" fill="#FCD34D" opacity="0.8"/>
    <!-- outer hex -->
    <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21" fill="none" stroke="#22D3EE" stroke-width="2.5" opacity="0.9"/>
    <!-- inner hex -->
    <polygon points="0,-21 18,-10.5 18,10.5 0,21 -18,10.5 -18,-10.5" fill="#22D3EE" opacity="0.16"/>
    <circle cx="0" cy="0" r="5.5" fill="#22D3EE"/>
    <!-- satellites -->
    <circle cx="72" cy="-44" r="8" fill="#3B82F6" opacity="0.9"/>
    <circle cx="78" cy="38" r="8" fill="#34D399" opacity="0.9"/>
    <circle cx="-63" cy="47" r="6.5" fill="#F59E0B" opacity="0.8"/>
  </g>

  <!-- title block -->
  <text x="284" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="62" font-weight="700" fill="#F8FAFC" letter-spacing="1.5">yi-nology</text>
  <rect x="286" y="158" width="316" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="284" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="500" fill="#E2E8F0">把复杂运维 · 变简单</text>
  <text x="284" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#64748B" letter-spacing="1.2">Kubernetes · Git Infrastructure · Agent-native Ops</text>

  <!-- constellation: three focus nodes -->
  <g transform="translate(0,-18)">
    <!-- edges -->
    <line x1="985" y1="128" x2="1128" y2="120" stroke="#22D3EE" stroke-width="1" opacity="0.4"/>
    <line x1="1128" y1="120" x2="1058" y2="238" stroke="#22D3EE" stroke-width="1" opacity="0.4"/>
    <line x1="1058" y1="238" x2="985" y2="128" stroke="#22D3EE" stroke-width="1" opacity="0.4"/>
    <!-- edge light dots -->
    <circle cx="1056" cy="124" r="2.5" fill="#67E8F9" opacity="0.85"/>
    <circle cx="1093" cy="179" r="2.5" fill="#67E8F9" opacity="0.85"/>
    <circle cx="1021" cy="183" r="2.5" fill="#67E8F9" opacity="0.85"/>

    <!-- node: k8s -->
    <g>
      <polygon points="985,94 1014,111 1014,145 985,162 956,145 956,111" fill="#3B82F6" fill-opacity="0.14" stroke="#3B82F6" stroke-width="2" opacity="0.95"/>
      <text x="985" y="132" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#93C5FD">k8s</text>
    </g>

    <!-- node: Git -->
    <g>
      <polygon points="1128,86 1157,103 1157,137 1128,154 1099,137 1099,103" fill="#22D3EE" fill-opacity="0.13" stroke="#22D3EE" stroke-width="2" opacity="0.95"/>
      <text x="1128" y="124" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#67E8F9">Git</text>
    </g>

    <!-- node: Agent -->
    <g>
      <polygon points="1058,204 1087,221 1087,255 1058,272 1029,255 1029,221" fill="#34D399" fill-opacity="0.13" stroke="#34D399" stroke-width="2" opacity="0.95"/>
      <text x="1058" y="242" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#6EE7B7">Agent</text>
    </g>
  </g>

  <!-- bottom path -->
  <path d="M72 292 C 280 252, 430 312, 630 272 S 1000 276, 1210 296" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  <circle cx="72" cy="292" r="4" fill="#3B82F6"/>
  <circle cx="630" cy="272" r="4" fill="#22D3EE"/>
  <circle cx="1210" cy="296" r="4" fill="#34D399"/>
</svg>
